<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Number Line Lab</title>
<!-- Chalkieboard demo lesson page (App Store screenshots, 2026-09-22). No cookies, no trackers, no outside files. -->
<style>
  :root { --ink:#26293b; --muted:#6d7186; --bg:#f6f4ee; --card:#ffffff;
          --c2:#ef476f; --c3:#f78c3b; --c4:#e7b10a; --c6:#11a57a; --c8:#1b7fc4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:16px 26px; background:var(--card);
           border-bottom:1px solid #e8e4da; }
  header svg { flex:none; }
  h1 { margin:0; font-size:26px; letter-spacing:-.2px; }
  .sub { color:var(--muted); font-size:15px; margin-top:2px; }
  main { max-width:1080px; margin:0 auto; padding:18px 26px 30px; }
  .ask { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
         background:var(--card); border-radius:20px; padding:16px 22px; box-shadow:0 2px 10px rgba(38,41,59,.07); }
  .ask .q { font-size:25px; font-weight:700; }
  .ask .q small { display:block; font-size:15px; font-weight:500; color:var(--muted); margin-top:2px; }
  .picks { display:flex; gap:10px; }
  .picks button { font:700 24px ui-rounded, -apple-system, system-ui, sans-serif; color:var(--ink);
                  background:#fff; border:3px solid #dcd7cb; border-radius:16px; padding:8px 20px; cursor:pointer; }
  .picks button.yes { border-color:var(--c6); background:#e3f6ef; }
  .picks button.no { border-color:var(--c2); background:#fde8ee; }
  #say { min-height:22px; margin:10px 4px 0; font-size:17px; color:var(--muted); }
  .lab { margin-top:12px; background:var(--card); border-radius:20px; padding:8px 18px 12px;
         box-shadow:0 2px 10px rgba(38,41,59,.07); }
  .rows { display:flex; gap:8px; flex-wrap:wrap; margin:6px 2px 4px; }
  .rows label { display:flex; align-items:center; gap:6px; font-size:15px; font-weight:600; color:var(--muted);
                background:#f3f1ea; border-radius:999px; padding:5px 12px; cursor:pointer; user-select:none; }
  .rows input { accent-color: var(--ink); }
  svg text { font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; }
  footer { text-align:center; color:var(--muted); font-size:13px; margin-top:14px; }
</style>
</head>
<body>
<header>
  <svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true">
    <rect width="42" height="42" rx="12" fill="#26293b"/>
    <line x1="8" y1="24" x2="34" y2="24" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="18" x2="10" y2="30" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
    <line x1="21" y1="19" x2="21" y2="29" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="18" x2="32" y2="30" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div><h1>Number Line Lab</h1><div class="sub">Grade 4 · Comparing fractions</div></div>
</header>
<main>
  <section class="ask">
    <div class="q">Which is greater: 2/3 or 3/4?<small>Find both on the number lines, then tap your answer.</small></div>
    <div class="picks"><button data-v="2/3">2/3</button><button data-v="3/4">3/4</button></div>
  </section>
  <div id="say" aria-live="polite"></div>
  <section class="lab">
    <div class="rows" id="toggles"></div>
    <svg id="lines" viewBox="0 0 1000 470" width="100%" role="img" aria-label="Number lines from 0 to 1"></svg>
  </section>
  <footer>Number Line Lab · a free Chalkieboard demo page for classroom use</footer>
</main>
<script>
const ROWS = [[2,"halves","#ef476f"],[3,"thirds","#f78c3b"],[4,"fourths","#e7b10a"],[6,"sixths","#11a57a"],[8,"eighths","#1b7fc4"]];
const X0 = 150, X1 = 950, TOP = 40, STEP = 88;
const svg = document.getElementById("lines"), NS = "http://www.w3.org/2000/svg";
const shown = new Set(ROWS.map(r => r[0]));
function el(name, attrs, text) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
function frac(g, x, y, n, d, color) {                     // stacked fraction: n over d
  g.appendChild(el("text", {x, y: y - 3, "text-anchor": "middle", "font-size": 19, "font-weight": 700, fill: color}, n));
  g.appendChild(el("line", {x1: x - 10, y1: y + 2, x2: x + 10, y2: y + 2, stroke: color, "stroke-width": 2.2, "stroke-linecap": "round"}));
  g.appendChild(el("text", {x, y: y + 22, "text-anchor": "middle", "font-size": 19, "font-weight": 700, fill: color}, d));
}
function draw() {
  svg.textContent = "";
  let row = 0;
  for (const [d, name, color] of ROWS) {
    if (!shown.has(d)) continue;
    const y = TOP + row * STEP, g = el("g", {});
    g.appendChild(el("text", {x: 18, y: y + 6, "font-size": 18, "font-weight": 700, fill: "#6d7186"}, name));
    const w = (X1 - X0) / d;
    for (let k = 0; k < d; k++)                           // soft bands between ticks
      g.appendChild(el("rect", {x: X0 + k * w + 2, y: y - 9, width: w - 4, height: 18, rx: 9, fill: color, opacity: k % 2 ? .16 : .28}));
    g.appendChild(el("line", {x1: X0 - 12, y1: y, x2: X1 + 12, y2: y, stroke: "#26293b", "stroke-width": 3.5, "stroke-linecap": "round"}));
    for (let k = 0; k <= d; k++) {
      const x = X0 + k * w, end = k === 0 || k === d;
      g.appendChild(el("line", {x1: x, y1: y - (end ? 16 : 12), x2: x, y2: y + (end ? 16 : 12), stroke: "#26293b", "stroke-width": end ? 4 : 3, "stroke-linecap": "round"}));
      if (k === 0) g.appendChild(el("text", {x, y: y + 40, "text-anchor": "middle", "font-size": 20, "font-weight": 700, fill: "#26293b"}, "0"));
      else if (k === d) g.appendChild(el("text", {x, y: y + 40, "text-anchor": "middle", "font-size": 20, "font-weight": 700, fill: "#26293b"}, "1"));
      else frac(g, x, y + 30, k, d, color);
    }
    svg.appendChild(g);
    row++;
  }
  svg.setAttribute("viewBox", `0 0 1000 ${TOP + Math.max(row, 1) * STEP}`);
}
const toggles = document.getElementById("toggles");
for (const [d, name] of ROWS) {
  const lab = document.createElement("label"), box = document.createElement("input");
  box.type = "checkbox"; box.checked = true;
  box.onchange = () => { box.checked ? shown.add(d) : shown.delete(d); draw(); };
  lab.append(box, document.createTextNode(name));
  toggles.append(lab);
}
document.querySelectorAll(".picks button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".picks button").forEach(o => o.className = "");
  const right = b.dataset.v === "3/4";
  b.className = right ? "yes" : "no";
  document.getElementById("say").textContent = right
    ? "Yes! 3/4 sits farther from 0 than 2/3, so 3/4 is greater."
    : "Not quite. Look again: which one is farther from 0?";
});
draw();
</script>
</body>
</html>
